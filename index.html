<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SMH Publisher</title>
  <meta name="description" content="SMH Publisher is a private tool Hayden Calaguiro uses to publish his own social posts.">
  <style>
    :root { --ink: #1a1a1a; --paper: #f7f5f0; --soft: #5c5a55; --line: #d9d5cc; }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; padding: 0 20px; background: var(--paper); color: var(--ink);
      font-family: Georgia, "Times New Roman", serif; font-size: 18px; line-height: 1.6;
    }
    main { max-width: 620px; margin: 0 auto; padding: 64px 0 48px; }
    h1 { font-size: 30px; line-height: 1.2; margin: 0 0 20px; font-weight: normal; }
    p { margin: 0 0 16px; }
    a { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
    a:hover, a:focus { color: var(--soft); }
    footer { border-top: 1px solid var(--line); margin-top: 40px; padding-top: 16px; color: var(--soft); font-size: 15px; }
    @media (max-width: 480px) { body { font-size: 17px; } main { padding-top: 40px; } h1 { font-size: 26px; } }
  </style>
</head>
<body>
  <main>
    <h1>SMH Publisher</h1>
    <p>SMH Publisher is a private tool Hayden Calaguiro uses to publish his own social posts.</p>
    <p><a href="privacy.html">Privacy policy</a></p>
    <footer>
      <p>Contact: <a href="mailto:hayden.calaguiro@gmail.com">hayden.calaguiro@gmail.com</a></p>
      <p>Last updated: November 11, 2026</p>
    </footer>
  </main>
</body>
</html>
